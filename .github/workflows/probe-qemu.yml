name: probe-qemu-stream-panics
on: [push, workflow_dispatch]
jobs:
  loop:
    runs-on: ubuntu-24.04-arm
    env:
      CC: clang
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@nextest
    - run: sudo apt-get update && sudo apt-get install -y qemu-user && qemu-aarch64 --version
    - run: cargo nextest run --lib --features=serde,zeroize --no-run
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu cortex-a72
    - name: CI's QEMU step exactly (the library's and the integration tests), after its native run, five times
      run: |
        cargo nextest run --lib --tests --features=serde,zeroize 2>&1 | grep -E "Summary"
        for i in 1 2 3 4 5; do CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="qemu-aarch64 -cpu cortex-a72" cargo nextest run --lib --tests --features=serde,zeroize --no-fail-fast 2>&1 | grep -E "SIGSEGV|QEMU internal|Summary" | head -3; done
